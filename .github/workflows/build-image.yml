name: build-emulator-image

# Builds the emulator as a linux/amd64 image and publishes it to GHCR.
#
# A cold build compiles GoogleSQL and takes hours on a 4-vCPU runner, and a
# runner can die part-way. So the Dockerfile builds in time-boxed stages and CI
# keeps each stage's layers in the registry (see .github/actions/build-and-publish).
# This workflow then runs up to four attempts one after another, each on a fresh
# runner that carries on from the layers already saved; the run is green if any
# attempt publishes the image, and red only if all of them fail.
#
# A push to a branch named perf/smoke-* rehearses the whole pipeline on a tiny
# target and publishes nothing; perf/smoke-retry* also fails the first attempt on
# purpose, to check that the next one continues from it.
#
# (Re-dispatching the workflow would be simpler, but GitHub only dispatches
# workflows that exist on the default branch.)
on:
  push:
    branches: ['perf/**']
    tags: ['v*']

# One build per ref at a time; a queued push waits rather than cancelling a build
# that is hours in.
concurrency:
  group: build-emulator-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-spanner-emulator
  REHEARSAL: ${{ startsWith(github.ref_name, 'perf/smoke') }}

jobs:
  attempt-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-publish
        with:
          image: ${{ env.IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rehearsal: ${{ env.REHEARSAL }}
      # Rehearsal only (branches named perf/smoke-retry*): fail this attempt after
      # its work is saved, to check that the next attempt carries on from it.
      - name: Rehearsal - simulate a failed attempt
        if: ${{ startsWith(github.ref_name, 'perf/smoke-retry') }}
        run: |
          echo "failing on purpose to exercise the next attempt" >&2
          exit 1
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  attempt-2:
    needs: attempt-1
    if: ${{ always() && needs.attempt-1.outputs.built != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-publish
        with:
          image: ${{ env.IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rehearsal: ${{ env.REHEARSAL }}
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  attempt-3:
    needs: [attempt-1, attempt-2]
    if: ${{ always() && needs.attempt-1.outputs.built != 'true' && needs.attempt-2.outputs.built != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-publish
        with:
          image: ${{ env.IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rehearsal: ${{ env.REHEARSAL }}
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  attempt-4:
    needs: [attempt-1, attempt-2, attempt-3]
    if: ${{ always() && needs.attempt-1.outputs.built != 'true' && needs.attempt-2.outputs.built != 'true' && needs.attempt-3.outputs.built != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-publish
        with:
          image: ${{ env.IMAGE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rehearsal: ${{ env.REHEARSAL }}
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # The verdict. The attempts above never fail the run themselves, so this is
  # what turns it red when none of them produced an image.
  result:
    needs: [attempt-1, attempt-2, attempt-3, attempt-4]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          built="${{ needs.attempt-1.outputs.built }}${{ needs.attempt-2.outputs.built }}${{ needs.attempt-3.outputs.built }}${{ needs.attempt-4.outputs.built }}"
          if [ -z "$built" ]; then
            echo "no attempt produced the image" >&2
            exit 1
          fi
          echo "image built and published"
