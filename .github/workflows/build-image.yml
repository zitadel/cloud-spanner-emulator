name: build-emulator-image

# Builds the emulator as a linux/amd64 image and publishes it to GHCR.
#
# A cold build compiles GoogleSQL, which takes hours, so the build is done in two
# steps that share a layer cache kept in the registry:
#
#   1. the `deps` stage (toolchain + prebuilt GoogleSQL), cached as soon as it
#      finishes, so a run that later runs out of time keeps that work;
#   2. the emulator itself, which starts from the cached `deps` layers.
#
# The cache lives in GHCR rather than the Actions cache, which is capped at 10 GB
# per repository and evicts a GoogleSQL build.
on:
  workflow_dispatch:
  push:
    branches: ['perf/**']
    tags: ['v*']

# One build per ref at a time; a queued push waits rather than cancelling a build
# that is hours in.
concurrency:
  group: build-emulator-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cloud-spanner-emulator

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail in the first minute, not after the compile, if this workflow cannot
      # publish to the package (for instance when the organisation restricts who
      # may create packages). It also creates the package already linked to this
      # repository.
      - name: Check that this workflow can publish to GHCR
        run: |
          printf 'FROM alpine:3.20\nLABEL org.opencontainers.image.source=%s\n' \
            "${{ github.server_url }}/${{ github.repository }}" \
            | docker buildx build --push -t "$IMAGE:ci-probe" -

      # Tags and labels. The source label links the package to this repository, so
      # it takes this repository's visibility and permissions.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=perf,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and cache the dependency stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: deps
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # The image is only as good as its first start: run what was published.
      - name: Smoke test the published image
        run: |
          docker run -d --name emulator -p 9010:9010 -p 9020:9020 \
            "$IMAGE:sha-${{ github.sha }}"
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9010) 2>/dev/null; then
              echo "emulator is listening on 9010"
              docker logs emulator 2>&1 | tail -5
              exit 0
            fi
            sleep 1
          done
          docker logs emulator 2>&1 | tail -30
          echo "emulator did not start listening on 9010" >&2
          exit 1
